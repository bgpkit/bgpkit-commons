[package]
name = "bgpkit-commons"
version = "0.12.0"
edition = "2024"
authors = ["Mingwei Zhang <mingwei@bgpkit.com>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/bgpkit/bgpkit-commons"
documentation = "https://docs.rs/bgpkit-commons"
description = """
A library for common BGP-related data and functions.
"""
keywords = ["bgp", "bgpkit"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }

chrono = { version = "0.4", features = ["serde"], optional = true }
ipnet = { version = "2.9", features = ["serde"], optional = true }
ipnet-trie = { version = "0.3.0", optional = true }
oneio = { version = "0.24.0", optional = true, features = [
    "json",
    "xz",
    "reqwest-gzip",
    "rustls",
    "ftp",
] }
rpsl-rs = { version = "3.0", optional = true }
regex = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }
tar = { version = "0.4", optional = true }
zstd = { version = "0.13", optional = true }
bcder = { version = "0.7", optional = true }

# Export-only deps (behind `export` feature)
arrow = { version = "59", optional = true }
parquet = { version = "59", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", optional = true }

[dev-dependencies]
tracing-subscriber = "0.3"
serde_json = "1"
oneio = { version = "0.24.0", features = ["json", "xz", "reqwest-gzip", "rustls", "ftp"] }


[features]
default = ["all"]

# Module features
irr = ["oneio", "rpsl-rs", "ipnet", "serde_json", "tracing"]
delegated = ["oneio", "tracing"]
asinfo = ["peeringdb", "irr", "delegated", "oneio", "serde_json", "tracing", "chrono", "regex"]
as2rel = ["oneio", "serde_json", "tracing"]
bogons = ["oneio", "ipnet", "regex", "chrono"]
countries = ["oneio"]
mrt_collectors = ["oneio", "chrono"]
peeringdb = ["oneio", "serde_json", "tracing"]
rpki = ["oneio", "ipnet", "ipnet-trie", "chrono", "tracing", "tar", "serde_json", "zstd", "bcder"]

# Export feature: enables Parquet export of all commons data sources
export = ["dep:arrow", "dep:parquet", "dep:clap", "dep:tracing-subscriber", "all"]

# Convenience feature to enable all modules
all = ["asinfo", "as2rel", "bogons", "countries", "delegated", "irr", "mrt_collectors", "peeringdb", "rpki"]

# Example configurations - specify required features for each example
[[example]]
name = "as2org"
required-features = ["asinfo", "countries"]

[[example]]
name = "collectors"
required-features = ["mrt_collectors"]

[[example]]
name = "list_aspas"
required-features = ["rpki"]

[[example]]
name = "rpki_historical"
required-features = ["rpki"]

[[example]]
name = "rpkispools"
required-features = ["rpki"]

[[example]]
name = "gen_full_jsonl"
required-features = ["asinfo"]

[[example]]
name = "bench_asinfo"
required-features = ["asinfo"]

[[bin]]
name = "bgpkit-export"
path = "src/bin/export.rs"
required-features = ["export"]

[lints.clippy]
uninlined_format_args = "allow"
collapsible_if = "allow"
